</style></head><body>
<header><div class="top"><b class="brand">Fekra</b><div id="who"></div></div><nav id="nav"></nav></header>
<main id="app"></main><div class="toast" id="toast" hidden></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const IND=['Fintech','E-commerce','Agritech','Healthcare','Education','Food & Beverage','Clean Energy','Logistics'];
const TYP=['Product','Service','Marketplace','Subscription / SaaS'];
const STG=['idea','prototype','mvp','early_revenue','growth'];
const egp=n=>Number(n).toLocaleString('en-US')+' EGP',label=s=>String(s).replace(/_/g,' ');
const mk=(id,own,by,title,biz,desc,ind,typ,fund,mkt,stage,status)=>({id,own,by,title,business_name:biz,description:desc,industry_id:ind,idea_type_id:typ,funding_needed:fund,currency:'EGP',target_market:mkt,idea_stage:stage,status});
const S={logged:false,role:null,tab:'signup',page:'',edit:null,cur:'c1',open:{},msgFor:null,f:{q:'',ind:'',max:'',stage:''},
me:{full_name:'Nour Hassan',email:'nour@example.com',phone:'+20 100 123 4567',city:'Cairo',avatar_url:'',website_url:'https://nilefresh.example',bio:'Agri-engineer building hydroponic farms for Greater Cairo.',investor_bio:'Angel investor backing early-stage Egyptian founders.',min_funding:200000,max_funding:2000000,preferred_idea_stage:'mvp',ind:[0,5,6],typ:[0,2]},
ideas:[
mk('i1','me','','Nile Fresh Hydroponics','Nile Fresh','Rooftop hydroponic farms supplying pesticide-free greens to Cairo restaurants and supermarkets all year round.',3,1,850000,'Restaurants and supermarkets in Greater Cairo','mvp','published'),
mk('i2','me','','Zamalek Study Hub','StudyHub','A bilingual co-study space and tutoring marketplace for university and IGCSE students.',5,2,300000,'Students aged 15–22 in central Cairo','idea','draft'),
mk('i3','o','Omar Adel','Koshary-to-Go','Koshary Express','Cloud-kitchen network delivering fresh koshary in 20 minutes with a loyalty app for regulars.',6,3,450000,'Office workers in Nasr City and Maadi','early_revenue','published'),
mk('i4','o','Salma Ibrahim','SolarSouq','SolarSouq','Online marketplace that lets households compare and finance rooftop solar installers.',7,3,1500000,'Homeowners in New Cairo and 6th of October','prototype','published'),
mk('i5','o','Karim Nabil','Fatora Easy','Fatora','Simple e-invoicing and tax filing software for small shops, fully in Arabic.',1,4,600000,'Small retailers and freelancers','mvp','published'),
mk('i6','o','Yara Mostafa','HakimNow','HakimNow','Home-visit nursing and teleconsultations booked in a few taps.',4,2,1200000,'Families in Greater Cairo','growth','published')],
inv:{v1:{name:'Hesham Mansour',bio:'Former CFO backing agri and clean-tech startups.',min:500000,max:3000000,stage:'mvp'},v2:{name:'Laila Samir',bio:'Angel investor and first-cheque specialist.',min:100000,max:1000000,stage:'idea'}},
ints:[{id:'n1',idea:'i1',inv:'v1',msg:'Your rooftop model fits our agritech focus. Can we talk numbers?',status:'active'},{id:'n2',idea:'i1',inv:'v2',msg:'Love the pilot results. Keen to learn more.',status:'active'},{id:'n3',idea:'i3',inv:'me',msg:'Interested in the cloud-kitchen model.',status:'active'}],
cons:[{id:'c1',int:'n2',side:'e',with:'Laila Samir',idea:'Nile Fresh Hydroponics',status:'accepted',msgs:[{f:'t',b:'Hi Nour, loved the pitch. Do you have pilot numbers?'},{f:'m',b:'Yes, 3 pilot rooftops running since March.'}]},
{id:'c2',int:'n3',side:'i',with:'Omar Adel',idea:'Koshary-to-Go',status:'accepted',msgs:[{f:'t',b:'Thanks for your interest! Happy to share our deck.'}]}],
flags:{i5:'Possible misleading revenue claim'},
users:[{n:'Omar Adel',r:'entrepreneur',s:0},{n:'Salma Ibrahim',r:'entrepreneur',s:0},{n:'Karim Nabil',r:'entrepreneur',s:0},{n:'Hesham Mansour',r:'investor',s:0},{n:'Laila Samir',r:'investor',s:0}]};
const REPLIES=['Sounds good. Can you share your financial projections?','Great, can we schedule a call this week?','Noted. What is your timeline for the funding round?'];
let tt;const toast=m=>{const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2400)};
const go=h=>location.hash==='#'+h?render():location.hash=h;
const opt=(l,c)=>l.map(([v,t])=>`<option value="${v}"${String(c)===String(v)?' selected':''}>${t}</option>`).join('');
const F=(c,l,v='',t='text',x='')=>`<label>${l}<code>${c}</code><input name="${c}" type="${t}" value="${esc(v)}" ${x}></label>`;
const TA=(c,l,v='',x='')=>`<label>${l}<code>${c}</code><textarea name="${c}" ${x}>${esc(v)}</textarea></label>`;
const Sel=(c,l,o,v)=>`<label>${l}<code>${c}</code><select name="${c}">${opt(o,v)}</select></label>`;
const gate=r=>`<h1>Not available</h1><p class="card">This page is for ${r}s only.</p>`;
const myInt=id=>S.ints.find(n=>n.idea===id&&n.inv==='me');
const card=i=>{const o=S.open[i.id],n=myInt(i.id);
const btn=S.role==='investor'&&i.own!=='me'?(n&&n.status==='active'?`<button class="ghost" data-act="wd" data-id="${i.id}">Interested ✓ Withdraw</button>`:`<button data-act="int" data-id="${i.id}">I’m Interested</button>`):'';
return `<article class="card"><div class="row"><h3>${esc(i.title)}</h3><span class="b ${i.status}">${i.status}</span></div>
<p class="m">${esc(i.business_name)} · ${IND[i.industry_id-1]} · ${TYP[i.idea_type_id-1]}</p>
<p><b>${egp(i.funding_needed)}</b> · stage: ${label(i.idea_stage)}</p>
<p>${esc(o?i.description:i.description.slice(0,90)+'…')}</p>
${o?`<p class="m"><b>Target market:</b> ${esc(i.target_market)}<br><b>Founder:</b> ${i.own==='me'?'You':esc(i.by)}</p>`:''}
<div class="acts"><button class="ghost" data-act="tog" data-id="${i.id}">${o?'Hide details':'Details'}</button>${btn}</div>
${S.msgFor===i.id?`<form data-form="int" class="acts" style="display:block"><input type="hidden" name="id" value="${i.id}">${TA('message','Message to founder','','placeholder="Why are you interested?"')}<button>Send interest</button></form>`:''}</article>`};
const myCard=i=>{const k=S.ints.filter(n=>n.idea===i.id&&n.status==='active').length;
return `<article class="card"><div class="row"><h3>${esc(i.title)}</h3><span class="b ${i.status}">${i.status}</span></div><p class="m">${IND[i.industry_id-1]} · ${egp(i.funding_needed)} · ${label(i.idea_stage)}</p><p class="m">${k} interested investor${k==1?'':'s'}</p><div class="acts"><button data-act="edit" data-id="${i.id}">Edit</button><button class="ghost" data-act="pub" data-id="${i.id}">${i.status==='published'?'Unpublish':'Publish'}</button></div></article>`};
const flt=()=>S.ideas.filter(i=>i.status==='published'&&(!S.f.q||(i.title+i.business_name+i.description).toLowerCase().includes(S.f.q.toLowerCase()))&&(!S.f.ind||i.industry_id==S.f.ind)&&(!S.f.max||i.funding_needed<=S.f.max)&&(!S.f.stage||i.idea_stage===S.f.stage));
const list=()=>{const r=flt();return `<p class="m">${r.length} idea${r.length==1?'':'s'} found</p>`+(r.map(card).join('')||'<p class="card">No ideas match these filters.</p>')};
const thread=c=>`<div class="card"><div class="row"><div><h3>${esc(c.with)}</h3><p class="m">${esc(c.idea)}</p></div><span class="b ${c.status}">${c.status}</span></div>
${c.status==='pending'?`<div class="acts"><button data-act="st" data-id="${c.id}:accepted">Simulate accept</button><button class="ghost" data-act="st" data-id="${c.id}:rejected">Simulate reject</button></div>`:''}
${c.status==='accepted'?`<div class="acts"><button class="ghost" data-act="st" data-id="${c.id}:closed">Close connection</button></div>`:''}
<div class="chat">${c.msgs.length?c.msgs.map(m=>`<div class="msg ${m.f==='m'?'me':''}">${esc(m.b)}</div>`).join(''):'<p class="m">No messages yet.</p>'}</div>
<form data-form="msg" data-id="${c.id}" class="acts" style="flex-wrap:nowrap"><input name="message_body" placeholder="${c.status==='accepted'?'Type a message':'Chat opens once accepted'}" ${c.status==='accepted'?'':'disabled'} required><button ${c.status==='accepted'?'':'disabled'}>Send</button></form></div>`;
const PG={
home:()=>`<section class="hero"><p class="eyebrow">Entrepreneur–investor platform · Cairo</p><h1>Where Cairo’s ideas meet capital</h1><p class="m">Entrepreneurs post ideas. Investors discover them, show interest and connect.</p><div class="acts">${S.logged?'<a class="btn" href="#dashboard">Go to dashboard</a>':'<a class="btn" href="#auth">Sign up</a>'}${S.role==='entrepreneur'?'':'<a class="btn ghost" href="#explore">Explore ideas</a>'}</div></section>
<h2>How it works</h2><div class="card"><h3>For entrepreneurs</h3><div class="step"><i>1</i><p>Sign up and choose <b>Entrepreneur</b>.</p></div><div class="step"><i>2</i><p>Submit your idea with its description, industry, funding needed and target market.</p></div><div class="step"><i>3</i><p>Publish it so investors can find it.</p></div><div class="step"><i>4</i><p>Open <b>Interested investors</b> to see who wants to back you.</p></div><div class="step"><i>5</i><p>Open a connection and chat once the investor accepts.</p></div></div><div class="card"><h3>For investors</h3><div class="step"><i>1</i><p>Sign up and choose <b>Investor</b>.</p></div><div class="step"><i>2</i><p>Set your preferences in <b>Account</b>: industries, idea types and funding range.</p></div><div class="step"><i>3</i><p>Explore ideas and filter by industry, funding and stage.</p></div><div class="step"><i>4</i><p>Tap <b>I’m Interested</b> and send a short message.</p></div><div class="step"><i>5</i><p>Accept the connection and chat with the founder.</p></div></div>
<h2>Our story</h2><div class="card story"><p>Fekra started with a simple observation in Cairo: good ideas and available money rarely find each other.</p><p>Many entrepreneurs have ideas worth building but no way to reach people who can fund them. Many investors have capital to put to work but struggle to find credible ideas that match what they look for.</p><p>Fekra means “idea” in Arabic. We built it to close that gap: entrepreneurs share their ideas, investors discover the ones that fit, and both can start a conversation.</p></div>${S.logged?'':'<h2>Try the demo</h2><div class="acts"><button data-act="demo" data-id="entrepreneur">Demo as entrepreneur</button><button class="ghost" data-act="demo" data-id="investor">Demo as investor</button></div>'}
<h2>Featured ideas</h2>${S.ideas.filter(i=>i.status==='published').slice(0,3).map(card).join('')}`,
auth:()=>`<h1>Welcome</h1><div class="tabs"><button class="${S.tab==='signup'?'':'ghost'}" data-act="tab" data-id="signup">Sign up</button><button class="${S.tab==='login'?'':'ghost'}" data-act="tab" data-id="login">Log in</button></div>
${S.tab==='signup'?`<form class="card" data-form="signup">${F('full_name','Full name',S.me.full_name,'text','required')}${F('email','Email',S.me.email,'email','required')}${F('password','Password','','password','required minlength=6')}${F('phone','Phone',S.me.phone,'tel')}${F('city','City',S.me.city,'text','required')}<button>Create account</button></form>`
:`<form class="card" data-form="login">${F('email','Email',S.me.email,'email','required')}${F('password','Password','demo123','password','required')}<button>Log in</button></form>`}<p class="note">No real login. Any details work.</p>`,
role:()=>`<h1>Choose your role</h1><p class="m">Stored as <code>user_profiles.role</code>. This can’t be changed later.</p>
<div class="card"><h3>💡 Entrepreneur</h3><p>Submit ideas and find investors.</p><button data-act="role" data-id="entrepreneur">I’m an entrepreneur</button></div>
<div class="card"><h3>💼 Investor</h3><p>Discover ideas and fund the right one.</p><button data-act="role" data-id="investor">I’m an investor</button></div>`,
dashboard:()=>{const m=S.me;
if(S.role==='entrepreneur'){const mine=S.ideas.filter(i=>i.own==='me'),k=S.ints.filter(n=>mine.some(i=>i.id===n.idea)&&n.status==='active').length;
return `<h1>Hello, ${esc(m.full_name.split(' ')[0])}</h1><div class="tiles"><div><b>${mine.length}</b>Ideas</div><div><b>${mine.filter(i=>i.status==='published').length}</b>Published</div><div><b>${k}</b>Interested investors</div><div><b>${S.cons.filter(c=>c.side==='e').length}</b>Connections</div></div>
<div class="acts"><button data-act="newidea">+ Submit new idea</button><a class="btn ghost" href="#interested">See investors</a></div><h2>My ideas</h2>${mine.map(myCard).join('')}`}
const mt=S.ideas.filter(i=>i.status==='published'&&i.own!=='me'&&i.funding_needed>=m.min_funding&&i.funding_needed<=m.max_funding&&m.ind.includes(i.industry_id-1));
return `<h1>Hello, ${esc(m.full_name.split(' ')[0])}</h1><div class="tiles"><div><b>${mt.length}</b>Matches</div><div><b>${S.ints.filter(n=>n.inv==='me'&&n.status==='active').length}</b>My interests</div><div><b>${S.cons.filter(c=>c.side==='i').length}</b>Connections</div><div><b>${Math.round(m.min_funding/1000)}k EGP</b>Min ticket</div></div>
<div class="acts"><a class="btn" href="#explore">Explore all ideas</a><a class="btn ghost" href="#account">Edit preferences</a></div><h2>Matches for your preferences</h2>${mt.map(card).join('')||'<p class="card">No matches yet.</p>'}`},
idea:()=>{if(S.role!=='entrepreneur')return gate('entrepreneur');
const E=S.edit?S.ideas.find(i=>i.id===S.edit):{title:'',business_name:'',description:'',industry_id:1,idea_type_id:1,funding_needed:'',target_market:'',idea_stage:'idea',status:'draft'};
return `<h1>${S.edit?'Edit idea':'Submit an idea'}</h1><form class="card" data-form="idea">${F('title','Idea title',E.title,'text','required maxlength=200')}${F('business_name','Business name',E.business_name)}${TA('description','Description',E.description,'required')}
${Sel('industry_id','Industry',IND.map((n,k)=>[k+1,n]),E.industry_id)}${Sel('idea_type_id','Idea type',TYP.map((n,k)=>[k+1,n]),E.idea_type_id)}${F('funding_needed','Funding needed','' + E.funding_needed,'number','required min=0')}${Sel('currency','Currency',[['EGP','EGP']],'EGP')}${TA('target_market','Target market',E.target_market,'required')}
${Sel('idea_stage','Idea stage',STG.map(s=>[s,label(s)]),E.idea_stage)}${Sel('status','Status',[['draft','Draft'],['published','Published']],E.status)}<div class="acts"><button>Save idea</button><a class="btn ghost" href="#dashboard">Cancel</a></div></form>`},
interested:()=>{if(S.role!=='entrepreneur')return gate('entrepreneur');
const ids=S.ideas.filter(i=>i.own==='me').map(i=>i.id),L=S.ints.filter(n=>ids.includes(n.idea)&&S.inv[n.inv]);
return `<h1>Interested investors</h1>`+(L.map(n=>{const v=S.inv[n.inv],i=S.ideas.find(x=>x.id===n.idea),c=S.cons.find(x=>x.int===n.id);
return `<article class="card"><div class="row"><h3>${esc(v.name)}</h3><span class="b ${n.status}">${n.status}</span></div><p class="m">For: ${esc(i.title)}</p><p>${esc(v.bio)}</p><p class="m">Ticket ${egp(v.min)} – ${egp(v.max)} · prefers ${label(v.stage)}</p><p>“${esc(n.msg)}”</p>
${n.status!=='active'?'':`<div class="acts">${c?`<button data-act="chat" data-id="${c.id}">Open chat</button>`:`<button data-act="connect" data-id="${n.id}">Open connection</button>`}</div>`}</article>`}).join('')||'<p class="card">No interest yet.</p>')},
explore:()=>`<h1>Explore ideas</h1><div class="card"><label>Search<code>title</code><input data-f="q" value="${esc(S.f.q)}" placeholder="e.g. solar"></label>
<div class="g2"><select data-f="ind"><option value="">All industries</option>${opt(IND.map((n,k)=>[k+1,n]),S.f.ind)}</select><select data-f="max">${opt([['','Any funding'],[500000,'≤ 500,000 EGP'],[1000000,'≤ 1,000,000 EGP'],[2000000,'≤ 2,000,000 EGP']],S.f.max)}</select></div>
<select data-f="stage" style="margin-top:8px"><option value="">All stages</option>${opt(STG.map(s=>[s,label(s)]),S.f.stage)}</select></div><div id="list">${list()}</div>`,
connections:()=>{const side=S.role==='investor'?'i':'e',cs=S.cons.filter(c=>c.side===side),c=cs.find(x=>x.id===S.cur)||cs[0];
return `<h1>Connections</h1>`+(c?`<div class="chips">${cs.map(x=>`<button class="chip ${x.id===c.id?'on':''}" data-act="pick" data-id="${x.id}">${esc(x.with)}</button>`).join('')}</div>${thread(c)}`:'<p class="card">No connections yet.</p>')},
account:()=>{const m=S.me,inv=S.role==='investor';
return `<h1>Account settings</h1><form class="card" data-form="acct"><h3>Profile <code>user_profiles</code></h3><p></p>${F('full_name','Full name',m.full_name,'text','required')}${F('phone','Phone',m.phone,'tel')}${F('city','City',m.city,'text','required')}${F('avatar_url','Avatar URL',m.avatar_url,'url')}<label>Role<code>role (locked)</code><input value="${S.role}" disabled></label>
${inv?`<h3>Investor profile <code>investor_profiles</code></h3><p></p>${TA('investor_bio','Investor bio',m.investor_bio)}${F('min_funding','Min funding (EGP)',m.min_funding,'number','min=0')}${F('max_funding','Max funding (EGP)',m.max_funding,'number','min=0')}${Sel('preferred_idea_stage','Preferred idea stage',STG.map(s=>[s,label(s)]),m.preferred_idea_stage)}${Sel('currency','Currency',[['EGP','EGP']],'EGP')}
<fieldset><legend>Preferred industries</legend>${IND.map((n,k)=>`<label class="ck"><input type="checkbox" name="ind" value="${k}"${m.ind.includes(k)?' checked':''}> ${n}</label>`).join('')}</fieldset>
<fieldset><legend>Preferred idea types</legend>${TYP.map((n,k)=>`<label class="ck"><input type="checkbox" name="typ" value="${k}"${m.typ.includes(k)?' checked':''}> ${n}</label>`).join('')}</fieldset>`
:`<h3>Entrepreneur profile <code>entrepreneur_profiles</code></h3><p></p>${F('website_url','Website URL',m.website_url,'url')}${TA('bio','Bio',m.bio)}`}<button>Save changes</button></form>`},
admin:()=>`<h1>Moderation</h1><p class="m">Simulated admin tools. Nothing is saved.</p><h2>Ideas</h2>${S.ideas.map(i=>`<article class="card"><div class="row"><h3>${esc(i.title)}</h3><span class="b ${i.status}">${i.status}</span></div><p class="m">By ${i.own==='me'?'Nour Hassan':esc(i.by)} · ${egp(i.funding_needed)}</p>${S.flags[i.id]?`<p class="flag">⚑ Reported: ${esc(S.flags[i.id])}</p>`:''}<div class="acts"><button data-act="ap" data-id="${i.id}">Approve</button><button class="ghost" data-act="cl" data-id="${i.id}">Close</button><button class="danger" data-act="rm" data-id="${i.id}">Remove</button></div></article>`).join('')||'<p class="card">No ideas.</p>'}
<h2>Users</h2>${S.users.map((u,k)=>`<div class="card row"><div><b>${esc(u.n)}</b><p class="m">${u.r}</p></div><div class="acts" style="margin:0">${u.s?'<span class="b rejected">suspended</span>':''}<button class="ghost" data-act="sus" data-id="${k}">${u.s?'Reinstate':'Suspend'}</button></div></div>`).join('')}`};
const A={
out(){S.logged=false;S.role=null;go('home')},
demo(r){S.logged=true;S.role=r;go('dashboard')},
role(r){S.role=r;toast('Role set: '+r);go('dashboard')},
tab(t){S.tab=t;render()},
tog(id){S.open[id]=!S.open[id];render()},
int(id){S.msgFor=id;S.open[id]=true;render()},
wd(id){myInt(id).status='withdrawn';toast('Interest withdrawn');render()},
edit(id){S.edit=id;go('idea')},
newidea(){S.edit=null;go('idea')},
pub(id){const i=S.ideas.find(x=>x.id===id);i.status=i.status==='published'?'draft':'published';render()},
pick(id){S.cur=id;render()},
chat(id){S.cur=id;go('connections')},
st(id){const[c,s]=id.split(':'),x=S.cons.find(k=>k.id===c);x.status=s;toast('Connection '+s);render()},
connect(id){const n=S.ints.find(x=>x.id===id),v=S.inv[n.inv],i=S.ideas.find(x=>x.id===n.idea);
const c={id:'c'+Date.now(),int:id,side:'e',with:v.name,idea:i.title,status:'pending',msgs:[]};S.cons.push(c);S.cur=c.id;toast('Connection request sent');render();
setTimeout(()=>{c.status='accepted';c.msgs.push({f:'t',b:'Hi, thanks for reaching out about '+i.title+'. Happy to chat.'});toast('Simulated: investor accepted');render()},1800)},
ap(id){const i=S.ideas.find(x=>x.id===id);i.status='published';delete S.flags[id];toast('Approved');render()},
cl(id){S.ideas.find(x=>x.id===id).status='closed';toast('Idea closed');render()},
rm(id){S.ideas=S.ideas.filter(x=>x.id!==id);S.ints=S.ints.filter(n=>n.idea!==id);delete S.flags[id];toast('Idea removed');render()},
sus(k){S.users[k].s=S.users[k].s?0:1;render()}};
const SUB={
signup(d){Object.assign(S.me,{full_name:d.get('full_name'),email:d.get('email'),phone:d.get('phone'),city:d.get('city')});S.logged=true;go('role')},
login(d){S.logged=true;go(S.role?'dashboard':'role')},
idea(d){const o={title:d.get('title'),business_name:d.get('business_name'),description:d.get('description'),industry_id:+d.get('industry_id'),idea_type_id:+d.get('idea_type_id'),funding_needed:+d.get('funding_needed'),currency:'EGP',target_market:d.get('target_market'),idea_stage:d.get('idea_stage'),status:d.get('status')};
if(S.edit)Object.assign(S.ideas.find(i=>i.id===S.edit),o);else S.ideas.unshift({id:'i'+Date.now(),own:'me',by:'',...o});S.edit=null;toast('Idea saved');go('dashboard')},
int(d){const id=d.get('id'),n=myInt(id);if(n){n.status='active';n.msg=d.get('message')}else S.ints.push({id:'n'+Date.now(),idea:id,inv:'me',msg:d.get('message'),status:'active'});S.msgFor=null;toast('Interest sent');render()},
msg(d,id){const c=S.cons.find(x=>x.id===id);c.msgs.push({f:'m',b:d.get('message_body')});render();
setTimeout(()=>{c.msgs.push({f:'t',b:REPLIES[c.msgs.length%3]});if(S.page==='connections')render()},1200)},
acct(d){const m=S.me;['full_name','phone','city','avatar_url','website_url','bio','investor_bio','preferred_idea_stage'].forEach(k=>d.has(k)&&(m[k]=d.get(k)));
if(d.has('min_funding')){const a=+d.get('min_funding'),b=+d.get('max_funding');if(a>b)return toast('Min funding must not exceed max funding');m.min_funding=a;m.max_funding=b;m.ind=d.getAll('ind').map(Number);m.typ=d.getAll('typ').map(Number)}
toast('Settings saved');render()}};
const NEED=['role','dashboard','idea','interested','explore','connections','account','admin'];
function render(){let p=(location.hash||'#home').slice(1);if(!PG[p])p='home';
if(NEED.includes(p)&&!S.logged)p='auth';else if(NEED.includes(p)&&p!=='role'&&!S.role)p='role';
if(p==='role'&&S.role)p='dashboard';
const lock={entrepreneur:['explore'],investor:['idea','interested']}[S.role]||[];
if(lock.includes(p)){toast('That area is for '+(S.role==='entrepreneur'?'investors':'entrepreneurs')+' only');p='dashboard'}
const changed=S.page!==p;S.page=p;
const l=[['home','Home']];
if(!S.logged)l.push(['auth','Sign up / Login']);else{l.push(['dashboard','Dashboard']);if(S.role==='entrepreneur')l.push(['idea','Submit idea'],['interested','Interested investors']);if(S.role==='investor')l.push(['explore','Explore']);l.push(['connections','Connections'],['account','Account'])}
if(S.logged)l.push(['admin','Admin']);
$('#nav').innerHTML=l.map(([h,t])=>`<a href="#${h}" class="${p===h?'on':''}">${t}</a>`).join('');
$('#who').innerHTML=S.logged?`<span class="chip">${S.role||'No role yet'}</span><button class="chip" data-act="out">Log out</button>`:'';
$('#app').innerHTML=PG[p]()+'<p class="note">Prototype · simulated data · refreshing resets everything</p>';
const ch=$('.chat');if(ch)ch.scrollTop=ch.scrollHeight;if(changed)scrollTo(0,0)}
addEventListener('hashchange',render);
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b&&A[b.dataset.act])A[b.dataset.act](b.dataset.id)});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target;SUB[f.dataset.form](new FormData(f),f.dataset.id)});
document.addEventListener('input',e=>{const k=e.target.dataset.f;if(k){S.f[k]=e.target.value;$('#list').innerHTML=list()}});
render();
</script></body></html>
